name: Prepare authentic Etsy-length Thanksgiving app video
on:
  push:
    branches: [media/real-thanksgiving-app-2026-10-09]
    paths:
      - .github/workflows/crow-crown-etsy-video.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trim-authentic-capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shorten authentic browser recording for Etsy without creating any new interface
        run: |
          set -euo pipefail
          cd marketing/live-app-media/2026-10-09
          ffmpeg -hide_banner -loglevel error -y -i real-app-recording.mp4 \
            -vf "setpts=0.68*(PTS-STARTPTS),fps=30,format=yuv420p" \
            -t 14.7 -an -c:v libx264 -preset fast -crf 24 -movflags +faststart \
            real-app-etsy-demo.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 real-app-etsy-demo.mp4
      - name: Commit ready-to-upload video on separate media branch
        run: |
          git config user.name "Crow & Crown Media Export"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketing/live-app-media/2026-10-09/real-app-etsy-demo.mp4
          if ! git diff --cached --quiet; then
            git commit -m "Add short Etsy-compatible true app navigation recording"
            git push origin HEAD:media/real-thanksgiving-app-2026-10-09
          fi