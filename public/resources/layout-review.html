<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thanksgiving responsive review</title><style>body{margin:0;padding:16px;background:#ddd;color:#222;font:13px system-ui}header{display:flex;gap:16px;align-items:center;margin-bottom:16px}select{padding:8px}main{display:flex;gap:24px;align-items:flex-start}section{flex:none}p{margin:0 0 10px}iframe{display:block;border:0;height:1000px;background:#111}button{padding:8px 12px}</style></head><body><header><span>Live responsive review · CSS viewport widths</span><label>Page <select id="route"><option value="home">Home</option><option value="plan-menu" selected>Plan Menu</option><option value="menu">Menu</option><option value="shopping">Shopping</option><option value="party-plan">Start</option><option value="table">Seating</option><option value="experience">Activities</option><option value="budget">Budget</option><option value="printables">Printables</option><option value="party-day">Party day</option><option value="guests">Guests</option><option value="prep">Prep</option><option value="timeline">Timeline</option></select></label><button id="reload">Reload views</button></header><main><section><p>320px</p><iframe title="320px phone" width="320" src="/index.html#plan-menu"></iframe></section><section><p>390px</p><iframe title="390px phone" width="390" src="/index.html#plan-menu"></iframe></section><section><p>430px</p><iframe title="430px phone" width="430" src="/index.html#plan-menu"></iframe></section></main><script>const frames=[...document.querySelectorAll('iframe')];document.querySelector('#route').onchange=e=>frames.forEach(f=>f.src='/index.html#'+e.target.value);document.querySelector('#reload').onclick=()=>frames.forEach(f=>f.src='/index.html?review='+Date.now()+'#'+document.querySelector('#route').value);</script></body></html>
