<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Crow & Crown · Whole app review</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#ededed;color:#222;font:14px Arial,sans-serif}header{padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #bbb}h1{font-size:16px;font-weight:400;margin:0}button,a{font:inherit;color:inherit}button{min-height:44px;padding:10px 16px;border:1px solid #aaa;border-radius:8px;background:transparent;cursor:pointer}button[aria-pressed=true]{background:#222;color:#fff}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;padding:20px;max-width:1400px;margin:auto}article{min-width:0}article h2{font-size:14px;font-weight:400;margin:0 0 10px;display:flex;justify-content:space-between}article a{font-size:12px}.preview{position:relative;overflow:hidden;background:#111;border:1px solid #bbb;border-radius:12px;width:100%}iframe{border:0;position:absolute;top:0;left:0;transform-origin:0 0}footer{padding:20px;color:#555}body[data-mode=web] main{grid-template-columns:repeat(auto-fit,minmax(360px,1fr))}@media(max-width:500px){main,body[data-mode=web] main{grid-template-columns:1fr}header{gap:8px}}
</style></head>
<body data-mode="phone"><header><h1>Crow & Crown · Every app page</h1><button id="phone" aria-pressed="true">Mobile · 390px</button><button id="web" aria-pressed="false">Web · 1120px</button><button id="refresh">Refresh live views</button></header><main id="pages"></main><footer>These are live views of the existing app, scaled for comparison. Open a page to use it at full size. Home is the typography reference.</footer>
<script>
const routes=[['home','Home'],['party-plan','Party plan'],['guests','Guests'],['plan-menu','Plan Menu'],['menu','Your Menu'],['shopping','Shopping'],['prep','Prep'],['timeline','Timeline'],['table','Seating'],['experience','Activities'],['budget','Budget'],['printables','Printables']];
const pages=document.querySelector('#pages');let mode='phone';
for(const [route,name] of routes){const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=name;const link=document.createElement('a');link.href='/#'+route;link.target='_blank';link.rel='noopener';link.textContent='Open ↗';heading.append(link);const preview=document.createElement('div');preview.className='preview';const iframe=document.createElement('iframe');iframe.title=name+' live preview';iframe.dataset.route=route;preview.append(iframe);article.append(heading,preview);pages.append(article);}
function size(){const width=mode==='phone'?390:1120,height=mode==='phone'?900:920;for(const p of document.querySelectorAll('.preview')){const frame=p.querySelector('iframe'),scale=p.clientWidth/width;p.style.height=height*scale+'px';frame.style.width=width+'px';frame.style.height=height+'px';frame.style.transform='scale('+scale+')';}}
function load(){for(const frame of document.querySelectorAll('iframe'))frame.src='/index.html?review='+Date.now()+'#'+frame.dataset.route;size();}
function setMode(next){mode=next;document.body.dataset.mode=mode;document.querySelector('#phone').setAttribute('aria-pressed',mode==='phone');document.querySelector('#web').setAttribute('aria-pressed',mode==='web');size();}
document.querySelector('#phone').onclick=()=>setMode('phone');document.querySelector('#web').onclick=()=>setMode('web');document.querySelector('#refresh').onclick=load;new ResizeObserver(size).observe(pages);load();
</script></body></html>
